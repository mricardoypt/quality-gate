# Add this job to your repo's CI workflow AFTER your test and security steps.
# Requires: coverage.xml, bandit.json, pip-audit.json at repo root.

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [your-test-job]   # replace with your actual test job name
    permissions:
      contents: read
      pull-requests: write
      checks: write

    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: quality-reports   # artifact containing coverage.xml, bandit.json, pip-audit.json

      - name: Run Quality Gate
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/repo \
            -v $(dirname "$GITHUB_STEP_SUMMARY"):$(dirname "$GITHUB_STEP_SUMMARY") \
            -e GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }} \
            -e GITHUB_REPOSITORY=${{ github.repository }} \
            -e GITHUB_SHA=${{ github.event.pull_request.head.sha || github.sha }} \
            -e GITHUB_RUN_ID=${{ github.run_id }} \
            -e PR_NUMBER=${{ github.event.pull_request.number }} \
            -e GITHUB_STEP_SUMMARY \
            ghcr.io/YOUR_ORG/quality-gate:latest

      - name: Upload Quality Gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-gate-report
          path: quality-gate-report.md
